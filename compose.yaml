services:
  app:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/abira_packaging
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: 0
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - abira-mongo:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  abira-mongo:
